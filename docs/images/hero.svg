<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Jev Decision Lab</title>
  <desc id="d">A situation flows into the Jev judgment model, comes out as typed answers with probability distributions, passes through explicit policy, and becomes a route. Probabilities, not prose.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2226"/>
      <stop offset="1" stop-color="#123539"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8f7a"/>
      <stop offset="1" stop-color="#5fd3b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fd3b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fd3b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="p1" d="M330 236 C 372 236, 380 236, 420 236"/>
    <path id="p2" d="M560 236 C 602 236, 610 236, 650 236"/>
    <path id="p3" d="M860 236 C 902 236, 910 236, 950 236"/>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #8fb3ad; font-size: 10.5px; letter-spacing: 0.14em; font-weight: 600; }
      .node { fill: #143439; stroke: #2a5a5a; stroke-width: 1; }
      .wire { stroke: #2f6a66; stroke-width: 1.5; fill: none; }
      .bar-track { fill: #1c4348; }
      .bar { fill: url(#mint); transform-box: fill-box; transform-origin: left center; }
      .k { fill: #cfe6e1; font-size: 11px; }
      .v { fill: #5fd3b8; font-size: 11px; }
      .route { font-size: 13px; font-weight: 700; }
      @keyframes grow { 0%, 12% { transform: scaleX(0); } 45%, 80% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes fade { 0%, 8% { opacity: 0; } 14%, 86% { opacity: 1; } 92%, 100% { opacity: 0; } }
      @keyframes ticker { 0% { transform: translateY(0); } 30% { transform: translateY(0); } 33% { transform: translateY(-22px); } 63% { transform: translateY(-22px); } 66% { transform: translateY(-44px); } 96% { transform: translateY(-44px); } 100% { transform: translateY(-66px); } }
      .b1 { animation: grow 6s cubic-bezier(.2,.7,.2,1) infinite; }
      .b2 { animation: grow 6s cubic-bezier(.2,.7,.2,1) infinite .15s; }
      .b3 { animation: grow 6s cubic-bezier(.2,.7,.2,1) infinite .3s; }
      .b4 { animation: grow 6s cubic-bezier(.2,.7,.2,1) infinite .45s; }
      .b5 { animation: grow 6s cubic-bezier(.2,.7,.2,1) infinite .6s; }
      .halo { animation: pulse 3s ease-in-out infinite; }
      .core { animation: breathe 3s ease-in-out infinite; transform-origin: 490px 236px; transform-box: view-box; }
      .out { animation: fade 6s ease-in-out infinite; }
      .rt { animation: ticker 9s steps(1, end) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .b1,.b2,.b3,.b4,.b5 { animation: none; transform: scaleX(1); }
        .halo,.core,.out,.rt { animation: none; }
        .dot { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <circle cx="490" cy="236" r="150" fill="url(#glow)" class="halo"/>

  <!-- wordmark -->
  <text x="48" y="64" fill="#ffffff" font-size="26" font-weight="600" letter-spacing="-0.6">Jev <tspan font-weight="800">Decision Lab</tspan></text>
  <text x="48" y="92" fill="#8fb3ad" font-size="13">Probabilities, not prose. Policy in code. Permission never from a model.</text>
  <g class="mono">
    <rect x="1014" y="44" width="138" height="24" rx="12" fill="#0f2a2e" stroke="#2a5a5a"/>
    <circle cx="1030" cy="56" r="4" fill="#5fd3b8" class="halo"/>
    <text x="1042" y="60" fill="#cfe6e1" font-size="10.5">local · loopback only</text>
  </g>

  <!-- 1 · state -->
  <text x="220" y="152" class="label mono">01 · STATE</text>
  <rect x="220" y="168" width="110" height="136" rx="10" class="node"/>
  <g fill="#3f7c78">
    <rect x="236" y="188" width="78" height="5" rx="2.5"/>
    <rect x="236" y="203" width="60" height="5" rx="2.5"/>
    <rect x="236" y="218" width="70" height="5" rx="2.5"/>
    <rect x="236" y="233" width="46" height="5" rx="2.5"/>
    <rect x="236" y="256" width="78" height="5" rx="2.5" fill="#5fd3b8"/>
    <rect x="236" y="271" width="54" height="5" rx="2.5" fill="#5fd3b8"/>
  </g>
  <text x="275" y="326" class="k" text-anchor="middle" font-size="10.5">message + evidence</text>

  <!-- 2 · jev -->
  <text x="438" y="152" class="label mono">02 · JEV · ONE CALL</text>
  <g class="core">
    <polygon points="490,176 542,206 542,266 490,296 438,266 438,206" fill="#0f2a2e" stroke="#5fd3b8" stroke-width="1.5"/>
    <polygon points="490,190 530,213 530,259 490,282 450,259 450,213" fill="none" stroke="#5fd3b8" stroke-opacity="0.35"/>
  </g>
  <text x="490" y="232" fill="#ffffff" text-anchor="middle" font-size="16" font-weight="700">jev</text>
  <text x="490" y="250" fill="#8fb3ad" text-anchor="middle" font-size="9.5" class="mono">choice · score · noul</text>
  <text x="490" y="326" class="k" text-anchor="middle" font-size="10.5">six typed questions · 70–500 ms claimed</text>

  <!-- 3 · typed judgments -->
  <text x="650" y="152" class="label mono">03 · TYPED ANSWERS</text>
  <rect x="650" y="168" width="210" height="136" rx="10" class="node"/>
  <g class="mono">
    <text x="664" y="190" class="k">owner</text>
    <text x="846" y="190" class="v out" text-anchor="end">operations 0.89</text>
    <rect x="664" y="196" width="182" height="5" rx="2.5" class="bar-track"/>
    <rect x="664" y="196" width="162" height="5" rx="2.5" class="bar b1"/>

    <text x="664" y="218" class="k">severity</text>
    <text x="846" y="218" class="v out" text-anchor="end">P(critical) 0.55</text>
    <rect x="664" y="224" width="182" height="5" rx="2.5" class="bar-track"/>
    <rect x="664" y="224" width="100" height="5" rx="2.5" class="bar b2"/>

    <text x="664" y="246" class="k">sufficient</text>
    <text x="846" y="246" class="v out" text-anchor="end">0.35</text>
    <rect x="664" y="252" width="182" height="5" rx="2.5" class="bar-track"/>
    <rect x="664" y="252" width="64" height="5" rx="2.5" class="bar b3"/>

    <text x="664" y="274" class="k">contradiction</text>
    <text x="846" y="274" class="v out" text-anchor="end">0.94</text>
    <rect x="664" y="280" width="182" height="5" rx="2.5" class="bar-track"/>
    <rect x="664" y="280" width="171" height="5" rx="2.5" class="bar b4"/>
  </g>
  <text x="755" y="326" class="k" text-anchor="middle" font-size="10.5">a distribution for every question</text>

  <!-- 4 · policy → route -->
  <text x="950" y="152" class="label mono">04 · POLICY → ROUTE</text>
  <rect x="950" y="168" width="200" height="136" rx="10" class="node"/>
  <g class="mono" font-size="10">
    <text x="966" y="192" fill="#6d8d89">source_fresh</text><text x="1134" y="192" fill="#6d8d89" text-anchor="end">pass</text>
    <text x="966" y="208" fill="#6d8d89">mandatory_review</text><text x="1134" y="208" fill="#6d8d89" text-anchor="end">pass</text>
    <text x="966" y="224" fill="#f5b942">critical_tail ≥ 0.30</text><text x="1134" y="224" fill="#f5b942" text-anchor="end">fired</text>
  </g>
  <rect x="966" y="238" width="168" height="1" fill="#2a5a5a"/>
  <clipPath id="clip"><rect x="960" y="248" width="184" height="24"/></clipPath>
  <g clip-path="url(#clip)">
    <g class="rt">
      <text x="1050" y="266" text-anchor="middle" fill="#f5b942" class="route">HUMAN REVIEW</text>
      <text x="1050" y="288" text-anchor="middle" fill="#5fd3b8" class="route">RECOMMEND A TEAM</text>
      <text x="1050" y="310" text-anchor="middle" fill="#ff9b8a" class="route">REQUEST EVIDENCE</text>
      <text x="1050" y="332" text-anchor="middle" fill="#f5b942" class="route">HUMAN REVIEW</text>
    </g>
  </g>
  <text x="1050" y="290" class="k" text-anchor="middle" font-size="10.5">0 new model calls · 0 external actions</text>
  <text x="1050" y="326" class="k" text-anchor="middle" font-size="10.5">your code owns the route</text>

  <!-- wires and travelling pulses -->
  <use href="#p1" class="wire"/><use href="#p2" class="wire"/><use href="#p3" class="wire"/>
  <circle r="3.5" fill="#5fd3b8" class="dot"><animateMotion dur="2s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
  <circle r="3.5" fill="#5fd3b8" class="dot"><animateMotion dur="2s" repeatCount="indefinite" begin="0.66s"><mpath href="#p2"/></animateMotion></circle>
  <circle r="3.5" fill="#f5b942" class="dot"><animateMotion dur="2s" repeatCount="indefinite" begin="1.33s"><mpath href="#p3"/></animateMotion></circle>
  <circle r="7" fill="#5fd3b8" opacity="0.35" filter="url(#soft)" class="dot"><animateMotion dur="2s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
  <circle r="7" fill="#5fd3b8" opacity="0.35" filter="url(#soft)" class="dot"><animateMotion dur="2s" repeatCount="indefinite" begin="0.66s"><mpath href="#p2"/></animateMotion></circle>
  <circle r="7" fill="#f5b942" opacity="0.35" filter="url(#soft)" class="dot"><animateMotion dur="2s" repeatCount="indefinite" begin="1.33s"><mpath href="#p3"/></animateMotion></circle>

  <!-- footer strip -->
  <rect x="48" y="372" width="1104" height="1" fill="#2a5a5a"/>
  <g class="mono" font-size="10.5" fill="#8fb3ad">
    <text x="48" y="398">TWELVE SYNTHETIC CASES</text>
    <text x="264" y="398">SEVENTY-TWO TYPED JUDGMENTS</text>
    <text x="548" y="398">ONE CONCURRENT BURST</text>
    <text x="796" y="398">RECEIPTS, NOT VIBES</text>
    <text x="1152" y="398" text-anchor="end" fill="#5fd3b8">$0.042 / M INPUT TOKENS · OUTPUT FREE</text>
  </g>
</svg>
