[project]
name = "jev-decision-lab"
version = "0.4.0"
description = "Synthetic-first enterprise judgment workbench for TypeSafe Jev, with live burst, playground and provider comparison"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only needed for the Claude comparison arm. The teaching app itself is stdlib-only.
compare = ["anthropic>=1.6,<2"]

[project.scripts]
jev-lab = "jev_lab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_lab"]

[tool.ruff]
line-length = 100
target-version = "py310"
