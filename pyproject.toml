[project]
name = "jev-decision-lab"
version = "0.5.0"
description = "A local lab for seeing what TypeSafe's Jev judgment model does on realistic business cases: typed answers, probabilities, policy in code, receipts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Lovell" }]
requires-python = ">=3.10"
keywords = ["jev", "typesafe", "judgment-model", "decision-support", "evaluation", "calibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jlov7/jev-decision-lab"
Source = "https://github.com/jlov7/jev-decision-lab"
Issues = "https://github.com/jlov7/jev-decision-lab/issues"
Changelog = "https://github.com/jlov7/jev-decision-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Only needed for the Claude comparison arm. The teaching app itself is stdlib-only.
compare = ["anthropic>=1.6,<2"]

[project.scripts]
jev-lab = "jev_lab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_lab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
