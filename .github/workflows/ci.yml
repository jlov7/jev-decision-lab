name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/setup_lab.py
      - run: python -m unittest discover -s tests -v
      - run: python -m jev_lab check
      - run: python -m pip install --quiet ruff==0.16.8 && ruff check jev_lab tests scripts
      - name: Check every JavaScript source and run evidence tests
        shell: bash
        run: |
          for file in web/*.js; do node --check "$file"; done
          node --test tests/evidence.test.cjs
      - name: Generated source register must not drift
        run: git diff --exit-code -- docs/SOURCES.md
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/setup_lab.py
      - run: python -m pip install --quiet playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Real loopback navigation and browser CSP, never a bridge
        run: python -m scripts.browser_check --output-dir "${{ runner.temp }}/browser-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/browser-evidence/
          retention-days: 14
          if-no-files-found: error
