name: Review tooling
on:
  push:
    branches: ['review/evidence-first-frontier-2026-09-20']
    paths: ['.github/workflows/review-tools.yml']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the pinned public lint wheel, no repository source
        run: python -m pip download --only-binary=:all: --no-deps ruff==0.16.8 --dest "${RUNNER_TEMP}/review-tools"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jev-review-tools
          path: ${{ runner.temp }}/review-tools/*.whl
          retention-days: 1
          if-no-files-found: error
