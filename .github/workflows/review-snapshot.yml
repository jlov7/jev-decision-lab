name: Review snapshot
on:
  push:
    branches: ['review/evidence-first-frontier-2026-09-20']
    paths: ['.github/workflows/review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source without Git credentials or working files
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/jev-review-source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jev-review-source
          path: ${{ runner.temp }}/jev-review-source.tar
          retention-days: 1
          if-no-files-found: error
