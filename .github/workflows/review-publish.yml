name: Verify recovered source
on:
  push:
    branches: ['review/evidence-first-frontier-2026-09-20']
    paths: ['.github/workflows/review-publish.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'jlov7/jev-decision-lab' && github.ref == 'refs/heads/review/evidence-first-frontier-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reconstruct and verify exact reviewed source tree
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication'
          out.mkdir()
          parts = [root / '.review-transfer' / ('part-%02d.b64' % i) for i in range(13)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          expected = '8daa340d30aa38aed4b941ac63ac3d710b8ca2ac19b0948dfee92439e459ecf2'
          assert len(data) == 55532 and hashlib.sha256(data).hexdigest() == expected, 'Transfer checksum mismatch'
          decoded = lzma.decompress(data, memlimit=268435456)
          assert len(decoded) == 204031
          entries = json.loads(decoded)
          assert len(entries) == 43 and len({e['path'] for e in entries}) == 43
          roots = {'docs', 'jev_lab', 'scripts', 'tests', 'web'}
          files = {'README.md', 'CHANGELOG.md', 'pyproject.toml', 'uv.lock', '.github/workflows/ci.yml'}
          for entry in entries:
              path = pathlib.PurePosixPath(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert str(path) in files or path.parts[0] in roots
              target = root / path
              assert not target.is_symlink()
              if 'contents' in entry:
                  text = entry['contents']
              else:
                  original = target.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == entry['old_sha256'], 'Base mismatch: ' + str(path)
                  lines = original.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = replacement
                  text = ''.join(lines)
              content = text.encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == entry['sha256'], 'Target mismatch: ' + str(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          for name in ['review-snapshot.yml', 'review-tools.yml', 'review-recover.yml', 'review-publish.yml']:
              (root / '.github/workflows' / name).unlink(missing_ok=True)
          legacy = root / '.github/recovery'
          assert {p.name for p in legacy.iterdir()} == {'%02d.b64' % i for i in range(10)}
          shutil.rmtree(legacy)
          shutil.rmtree(root / '.review-transfer')
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '8af6c5c1e76a2b72440820d9392e54fd395c5ba0', 'Full source tree mismatch: ' + tree
          (out / 'paths.json').write_text(json.dumps([e['path'] for e in entries]))
          print('Verified 43 source paths and full tree', tree)
          PY
      - name: Run recovered source checks
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/publication"
          python scripts/setup_lab.py
          python -m unittest discover -s tests -v 2>&1 | tee "$OUT/python-tests.txt"
          python -m jev_lab check | tee "$OUT/case-check.txt"
          python -m pip install --quiet ruff==0.16.8
          ruff check jev_lab tests scripts | tee "$OUT/lint.txt"
          for file in web/*.js; do node --check "$file"; done
          node --test tests/evidence.test.cjs | tee "$OUT/javascript-tests.txt"
          git diff --exit-code
      - name: Prepare GitHub blobs only, no branch update or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, pathlib, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication'
          api = 'https://api.github.com/repos/jlov7/jev-decision-lab/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def request(path, payload=None):
              req = urllib.request.Request(api + path, data=None if payload is None else json.dumps(payload).encode(), headers=headers, method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          assert request('git/ref/heads/main')['object']['sha'] == '93c076302e6fdf4891e08e8d4fa71bef9c63f3a1', 'Main changed; reconcile before publication'
          def prepare(path):
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              result = request('git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert result['sha'] == expected, 'Blob mismatch: ' + path
              return {'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected}
          paths = json.loads((out / 'paths.json').read_text())
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              entries = list(pool.map(prepare, paths))
          manifest = {'source_parent': os.environ['GITHUB_SHA'], 'base_tree': '49678e44842f3bbba2591498633b6d31281839ed', 'target_tree': '8af6c5c1e76a2b72440820d9392e54fd395c5ba0', 'transfer_sha256': '8daa340d30aa38aed4b941ac63ac3d710b8ca2ac19b0948dfee92439e459ecf2', 'tree_elements': entries}
          (out / 'publication-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Prepared', len(entries), 'verified source blobs. Branch and main remain unchanged by this job.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-manifest
          path: ${{ runner.temp }}/publication/
          retention-days: 14
          if-no-files-found: error
